<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Request</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #ffffff;
    --border: #e0d8cc;
    --ink: #1a1814;
    --muted: #9a9082;
    --accent: #c84b2f;
    --accent-dim: rgba(200,75,47,0.08);
    --accent-mid: rgba(200,75,47,0.3);
    --green: #2a7a4b;
    --green-dim: rgba(42,122,75,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    width: 100%;
    max-width: 540px;
    position: relative;
    box-shadow: 4px 4px 0 var(--border);
  }

  .card-header {
    padding: 28px 32px 22px;
    border-bottom: 1.5px solid var(--border);
  }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.1;
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }

  .card-body { padding: 28px 32px; display: flex; flex-direction: column; gap: 24px; }

  .field { display: flex; flex-direction: column; gap: 8px; }

  label {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  input[type="text"] {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus { border-color: var(--accent-mid); }
  input[type="text"]::placeholder { color: var(--muted); }

  /* ── Date input ── */
  .date-input-wrap { position: relative; }

  input[type="text"].date-text {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"].date-text:focus { border-color: var(--accent-mid); }
  input[type="text"].date-text::placeholder { color: var(--muted); }
  input[type="text"].date-text.valid   { border-color: rgba(42,122,75,0.4); }
  input[type="text"].date-text.invalid { border-color: var(--accent-mid); }

  .date-preview {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.06em;
    min-height: 14px;
  }

  /* Units */
  .units-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .unit-chip {
    border: 1.5px solid var(--border);
    border-radius: 3px;
    padding: 9px 12px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    transition: all 0.12s;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .unit-chip .check {
    width: 14px; height: 14px;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    transition: all 0.12s;
  }
  .unit-chip.selected {
    border-color: var(--accent-mid);
    background: var(--accent-dim);
    color: var(--ink);
  }
  .unit-chip.selected .check {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .unit-chip:hover:not(.selected) { border-color: #c0b8ac; color: var(--ink); }

  .divider { border: none; border-top: 1.5px solid var(--border); }

  /* Footer */
  .card-footer { padding: 0 32px 28px; display: flex; flex-direction: column; gap: 10px; }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 3px 3px 0 var(--accent-mid);
  }
  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:active { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--accent-mid); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-clear {
    width: 100%;
    padding: 10px;
    background: none;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-clear:hover { border-color: var(--accent-mid); color: var(--accent); }

  .status {
    font-size: 11px;
    text-align: center;
    min-height: 18px;
    letter-spacing: 0.04em;
  }
  .status.ok   { color: var(--green); }
  .status.err  { color: var(--accent); }
  .status.info { color: var(--muted); }

  /* Success overlay */
  .success-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: var(--surface);
    border-radius: 4px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    padding: 40px;
    z-index: 10;
  }
  .success-overlay.show { display: flex; }
  .success-icon {
    width: 56px; height: 56px;
    background: var(--green-dim);
    border: 1.5px solid var(--green);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    color: var(--green);
  }
  .success-overlay h2 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
  }
  .success-overlay p {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 300px;
  }
  .success-date {
    font-size: 11px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em;
  }
  .btn-reset {
    margin-top: 8px;
    background: none;
    border: 1.5px solid var(--border);
    color: var(--muted);
    padding: 9px 20px;
    border-radius: 3px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-reset:hover { border-color: var(--ink); color: var(--ink); }
</style>
</head>
<body>

<div class="card">

  <div class="success-overlay" id="successOverlay">
    <div class="success-icon">✓</div>
    <h2>Request Sent!</h2>
    <p>Your request has been queued. You'll be notified once a shift is picked up and ready to transfer.</p>
    <div class="success-date" id="successDate"></div>
    <button class="btn-reset" onclick="reset()">Submit another request</button>
  </div>

  <div class="card-header">
    <div class="eyebrow">SnipeAllowed</div>
    <h1>Request a Shift</h1>
    <p class="subtitle">Enter your name, pick a date, and select the buildings you'll accept.</p>
  </div>

  <div class="card-body">

    <div class="field">
      <label>Your Name</label>
      <input type="text" id="nameInput" placeholder='e.g. "Oski Bear"' />
    </div>

    <hr class="divider">

    <div class="field">
      <label>Shift Date</label>
      <div class="date-input-wrap">
        <input type="text" class="date-text" id="dateInput"
               placeholder="e.g. April 3"
               oninput="onDateInput()"
               autocomplete="off" />
      </div>
      <div class="date-preview" id="datePreview"></div>
    </div>

    <hr class="divider">

    <div class="field">
      <label>Buildings you'll accept</label>
      <div class="units-grid" id="unitsGrid"></div>
    </div>

  </div>

  <div class="card-footer">
    <button class="btn-submit" id="submitBtn">SUBMIT REQUEST</button>
    <button class="btn-clear" id="clearBtn">CLEAR</button>
    <div class="status info" id="status">All fields required.</div>
  </div>
</div>

<script>
  const PASSWORD = "Georgia1234$";

  function checkPassword() {
    const input = prompt("Enter password:");
    if (input !== PASSWORD) {
      document.body.innerHTML = "<h2 style='font-family: sans-serif; text-align:center; margin-top:50px;'>Access Denied</h2>";
    }
  }

  checkPassword();
  const SERVER_URL  = "https://unshared-nannie-pleasurelessly.ngrok-free.dev";
  const FORM_SECRET = "x7k2-adrian-9qm";

  const UNITS = [
    "Unit 1 - Cheney",       "Unit 1 - Christian",
    "Unit 1 - Freeborn",     "Unit 1 - Deutsch",
    "Unit 1 - Slottman",     "Unit 1 - Putnam",
    "Unit 2 - Max Martinez", "Unit 2 - Davidson",
    "Unit 2 - Griffiths",    "Unit 2 - Towle",
    "Unit 2 - Ehrman",       "Unit 2 - Wada",
    "Unit 2 - Cunningham",   "Unit 3 - Norton",
    "Unit 3 - Spens-Black",  "Unit 3 - Blackwell",
    "Unit 3 - Ida Sproul",   "Unit 3 - Beverly Cleary",
    "Unit 3 - Priestley",    "Unit 3 - Anchor House",
    "Unit 1 - Rover",
    "Unit 2 - Rover",
    "Unit 3 - North Rover"
  ];

  let selectedUnits   = new Set();
  let selectedDateObj = null;

  // ── Date parsing ──────────────────────────────────────────────────────

  const MONTHS = {
    january:1, february:2, march:3, april:4, may:5, june:6,
    july:7, august:8, september:9, october:10, november:11, december:12,
    jan:1, feb:2, mar:3, apr:4, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12
  };

  function parseDate(raw) {
    // Accepts "April 3", "apr 3", "april 3" — month name + space + number, no ordinals
    const parts = raw.trim().toLowerCase().split(/\s+/);
    if (parts.length < 2) return null;
    const month = MONTHS[parts[0]];
    const day   = parseInt(parts[1], 10);
    if (!month || isNaN(day) || day < 1 || day > 31) return null;
    const year  = new Date().getFullYear();
    const d     = new Date(year, month - 1, day);
    // Verify date is real (e.g. not Feb 30)
    if (d.getMonth() !== month - 1) return null;
    return d;
  }

  function dateToFormats(d) {
    const monthLong  = d.toLocaleString('en-US', { month: 'long'  }).toLowerCase();
    const monthShort = d.toLocaleString('en-US', { month: 'short' }).toLowerCase();
    const day        = d.getDate();
    return [`${monthLong} ${day}`, `${monthShort} ${day}`];
  }

  function friendlyDate(d) {
    const today    = new Date(); today.setHours(0,0,0,0);
    const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
    const cmp      = new Date(d); cmp.setHours(0,0,0,0);
    if (cmp.getTime() === today.getTime())    return 'Today';
    if (cmp.getTime() === tomorrow.getTime()) return 'Tomorrow';
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function onDateInput() {
    const raw     = document.getElementById('dateInput').value;
    const input   = document.getElementById('dateInput');
    const preview = document.getElementById('datePreview');

    if (!raw.trim()) {
      selectedDateObj = null;
      input.className = 'date-text';
      preview.textContent = '';
      return;
    }

    const parsed = parseDate(raw);
    if (parsed) {
      selectedDateObj = parsed;
      input.className = 'date-text valid';
      const [fmt1] = dateToFormats(parsed);
      preview.textContent = `→ ${friendlyDate(parsed)} · scanning "${fmt1}"`;
      preview.style.color = 'var(--green)';
    } else {
      selectedDateObj = null;
      input.className = 'date-text invalid';
      preview.textContent = '→ type a month and day, e.g. April 3';
      preview.style.color = 'var(--accent)';
    }
  }

  // No default date — leave blank so user must type it intentionally

  // ── Units ─────────────────────────────────────────────────────────────

  function renderUnits() {
    const g = document.getElementById('unitsGrid');
    g.innerHTML = '';
    UNITS.forEach(unit => {
      const chip = document.createElement('div');
      chip.className = 'unit-chip' + (selectedUnits.has(unit.toLowerCase()) ? ' selected' : '');
      chip.innerHTML = `<span class="check">${selectedUnits.has(unit.toLowerCase()) ? '✓' : ''}</span>${unit}`;
      chip.onclick = () => {
        const k = unit.toLowerCase();
        selectedUnits.has(k) ? selectedUnits.delete(k) : selectedUnits.add(k);
        renderUnits();
      };
      g.appendChild(chip);
    });
  }

  // ── Submit ────────────────────────────────────────────────────────────

  document.getElementById('submitBtn').onclick = async () => {
    const name = document.getElementById('nameInput').value.trim();
    if (!name)              { showStatus('Please enter your name.', 'err');        return; }
    if (!selectedDateObj)   { showStatus('Please select a date.', 'err');          return; }
    if (!selectedUnits.size){ showStatus('Select at least one building.', 'err');  return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'SENDING…';

    const targetDates = dateToFormats(selectedDateObj);

    try {
      const res = await fetch(`${SERVER_URL}/request`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          secret:        FORM_SECRET,
          requesterName: name,
          targetDates,
          allowedUnits:  [...selectedUnits].map(u => {
            const m = u.match(/^(unit \d+) - (.+)$/i);
            if (!m) return u.trim();
            const prefix   = m[1].toLowerCase();
            const unitName = m[2].toLowerCase().trim();
            if (unitName.includes("rover")) return `${prefix} ${unitName}`;
            return unitName;
          })
        })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        const [fmt1] = targetDates;
        document.getElementById('successDate').textContent =
          `Date: ${friendlyDate(selectedDateObj)} · ${fmt1}`;
        document.getElementById('successOverlay').classList.add('show');
      } else {
        showStatus(data.error || 'Something went wrong.', 'err');
      }
    } catch (e) {
      showStatus('Could not reach the server. Is it running?', 'err');
    }

    btn.disabled = false; btn.textContent = 'SUBMIT REQUEST';
  };

  // ── Helpers ───────────────────────────────────────────────────────────

  function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = 'status ' + type;
  }

  function reset() {
    document.getElementById('nameInput').value = '';
    document.getElementById('dateInput').value = '';
    document.getElementById('dateInput').className = 'date-text';
    document.getElementById('datePreview').textContent = '';
    selectedDateObj = null;
    selectedUnits   = new Set();
    document.getElementById('successOverlay').classList.remove('show');
    renderUnits();
    showStatus('All fields required.', 'info');
  }

  // ── Submissions open/closed poll ──────────────────────────────────────

  async function checkSubmissionsOpen() {
    try {
      const res  = await fetch(`${SERVER_URL}/status`);
      const data = await res.json();
      if (data.submissionsOpen === false) {
        document.getElementById('submitBtn').disabled = true;
        showStatus('Submissions are currently closed.', 'err');
      } else {
        document.getElementById('submitBtn').disabled = false;
        showStatus('All fields required.', 'info');
      }
    } catch(e) {}
  }

  checkSubmissionsOpen();
  setInterval(checkSubmissionsOpen, 10000);

  document.getElementById('clearBtn').onclick = async () => {
    try { await fetch(`${SERVER_URL}/clear`, { method: 'POST' }); } catch(e) {}
    reset();
    showStatus('Selections cleared.', 'info');
  };

  renderUnits();
</script>
</body>
</html>
